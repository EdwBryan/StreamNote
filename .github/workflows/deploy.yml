# Despliegue continuo: cada merge a development aplica Terraform en dev y publica la app.
# qa y main no despliegan: solo hay un ambiente en AWS para no pagar tres.
name: deploy

on:
  push:
    branches: [development]
    # Solo documentación o el bootstrap (que Bryan aplica a mano): no hay nada que desplegar
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - "infra/bootstrap/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # creando dev desde cero tarda ~8 min
    env:
      STAGE: dev
    environment: dev
    concurrency:
      group: deploy-dev   # nunca dos despliegues a la vez
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar backend para Lambda
        working-directory: backend
        run: |
          npm ci
          npm run build:lambda

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false   # sin esto "terraform output" devuelve texto extra

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.4.2

      # 1) Infraestructura: primero el plan, después las reglas del equipo, y recién ahí el apply
      - name: Terraform plan
        working-directory: infra/terraform/envs/aws
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=lab09/${STAGE}/terraform.tfstate"
          terraform plan -input=false -var-file="${STAGE}.tfvars" -out=tfplan
          terraform show -json tfplan > plan.json

      # Versión fija y comprobada con la suma SHA-256 que publica Infracost en el mismo release
      - name: Instalar Infracost
        env:
          VERSION: v2.21.0
        run: |
          set -euo pipefail
          base="https://github.com/infracost/cli/releases/download/${VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/infracost-linux-amd64.tar.gz"
          curl -fsSLO "$base/infracost-linux-amd64.tar.gz.sha256"
          sha256sum -c infracost-linux-amd64.tar.gz.sha256
          tar -xzf infracost-linux-amd64.tar.gz infracost
          sudo mv infracost /usr/local/bin/infracost
          infracost --version

      # Dos estimaciones del mes: sobre plan.json (lo fijo, tal como se va a aplicar) y sobre
      # el código con infra/infracost/uso-dev.yml (Infracost no aplica el archivo de uso a un plan).
      - name: Costo estimado (Infracost)
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
        run: |
          set -euo pipefail
          (cd infra/terraform/envs/aws && infracost scan plan.json --json --no-color > "$RUNNER_TEMP/costo-plan.json")
          infracost scan --json --no-color > "$RUNNER_TEMP/costo-codigo.json"   # lee infracost.yml
          suma='[.resources[] | (.cost_components // [])[] | .total_monthly_cost | tonumber] | add // 0'
          plan=$(jq "[.projects[] | $suma] | add // 0" "$RUNNER_TEMP/costo-plan.json")
          codigo=$(jq "[.projects[] | select(.project_name == \"infra-terraform-envs-aws-${STAGE}\") | $suma] | add // 0" "$RUNNER_TEMP/costo-codigo.json")
          jq -n --argjson plan "$plan" --argjson codigo "$codigo" '{costo: {plan: $plan, codigo: $codigo}}' > costo.json
          cat costo.json
          printf '### Costo estimado de `%s`\n- Sobre el plan (fijo): %.2f USD/mes\n- Con uso estimado: %.2f USD/mes\n- Se compara la mayor × 1,18 (IGV)\n' \
            "$STAGE" "$plan" "$codigo" >> "$GITHUB_STEP_SUMMARY"

      # Reglas 1–3 sobre el plan; la 4 además corta si el costo pasa el límite del ambiente
      - name: Reglas del equipo (OPA)
        run: opa eval --fail-defined --format pretty -d policies -d costo.json -i infra/terraform/envs/aws/plan.json "data.streamnote.deny[msg]"

      - name: Terraform apply
        working-directory: infra/terraform/envs/aws
        run: |
          terraform apply -input=false tfplan
          {
            echo "API_URL=$(terraform output -raw api_url)"
            echo "WEB_URL=$(terraform output -raw web_url)"
            echo "WEB_BUCKET=$(terraform output -raw web_bucket)"
            echo "CF_ID=$(terraform output -raw cloudfront_id)"
            echo "DB_CLUSTER_ARN=$(terraform output -raw db_cluster_arn)"
            echo "DB_SECRET_ARN=$(terraform output -raw db_secret_arn)"
            echo "AUTH_MODE=$(terraform output -raw auth_mode)"
            echo "COGNITO_DOMAIN=$(terraform output -raw cognito_domain)"
            echo "COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id)"
            } >> "$GITHUB_ENV"

      # 2) Base de datos: migraciones por la Data API (HTTPS + IAM, sin túnel)
      - name: Migraciones
        working-directory: backend
        run: npm run migrate:aws

      # 3) Web: compilar con la URL real de la API y los datos públicos de Cognito,
      #    subir y refrescar la caché de CloudFront
      - name: Publicar la web
        working-directory: web
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_AUTH_MODE: ${{ env.AUTH_MODE }}
          VITE_COGNITO_DOMAIN: ${{ env.COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ env.COGNITO_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          aws s3 sync dist "s3://$WEB_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"

      # 4) Prueba después del deploy: la API responde y pide token.
      #    La web no se prueba aquí porque CloudFront solo deja entrar desde Perú.
      - name: Probar la API
        run: |
          estado=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/me")
          echo "GET /me sin token: $estado (se espera 401)"
          test "$estado" = 401

      - name: Resumen
        run: |
          echo "### StreamNote desplegado en \`$STAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
