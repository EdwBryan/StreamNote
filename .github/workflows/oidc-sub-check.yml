name: oidc-sub-check

on:
  push:
    paths:
      - ".github/workflows/oidc-sub-check.yml"
  workflow_dispatch:
 
permissions:
  id-token: write   # permite pedir el token OIDC
  contents: read
 
jobs:
  ver-sub:
    runs-on: ubuntu-latest
    environment: dev   # el mismo environment que exige la política de confianza
    steps:
      - name: Pedir el token y mostrar sus claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # El JWT tiene 3 partes separadas por "."; la del medio son los claims
          CLAIMS=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#CLAIMS} % 4 )) -ne 0 ]; do CLAIMS="$CLAIMS="; done
          echo "$CLAIMS" | base64 -d | jq '{sub, aud, repository, repository_id, repository_owner, repository_owner_id, environment}'
          SUB=$(echo "$CLAIMS" | base64 -d | jq -r '.sub')
          echo "### sub firmado por GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SUB\`" >> "$GITHUB_STEP_SUMMARY"
