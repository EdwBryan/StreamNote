# Revisión de Terraform en cada Pull Request. No entra a AWS: el rol solo lo asume el deploy de dev.
name: plan

on:
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar backend para Lambda
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run build:lambda

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Formato
        run: terraform fmt -check -recursive infra/terraform
        continue-on-error: true

      - name: Validar
        working-directory: infra/terraform/envs/aws
        run: |
          terraform init -input=false -backend=false
          terraform validate
